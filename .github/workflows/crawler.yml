name: Steam Early Access Crawler

on:
  # Schedule disabled — crawler runs on Vercel Cron (Hobby: once/day per job).
  # GitHub Actions secrets are not configured; keep manual workflow_dispatch only.
  workflow_dispatch:
    inputs:
      job_type:
        description: "Crawler job to run (discover | refresh-hot | refresh-store | refresh-news | refresh-players | rescore | seed-migrate)"
        required: true
        default: "refresh-hot"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # version comes from package.json "packageManager" (pnpm@10.33.0).
      # Do not also set `with.version` — pnpm/action-setup@v4 errors on both.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Manual Crawler Job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not configured. Prefer Vercel Cron (/api/cron/*)."
            echo "Exiting without failure so the workflow stays usable as a stub."
            exit 0
          fi
          pnpm tsx crawler/index.ts "${{ github.event.inputs.job_type }}"
