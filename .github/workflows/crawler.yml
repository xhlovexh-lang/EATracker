name: Steam Early Access Crawler

on:
  schedule:
    # Daily discovery and hot refresh at 02:15 UTC
    - cron: "15 2 * * *"
    # Rolling store refresh every 6 hours
    - cron: "30 */6 * * *"
    # Weekly full developer news sweep on Sundays at 04:00 UTC
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      job_type:
        description: "Crawler job to run (discover | refresh-hot | refresh-store | refresh-all-news | rescore)"
        required: true
        default: "refresh-hot"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Scheduled or Manual Crawler Job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm tsx crawler/index.ts "${{ github.event.inputs.job_type }}"
          elif [ "${{ github.event.schedule }}" = "0 4 * * 0" ]; then
            pnpm tsx crawler/index.ts refresh-all-news
          elif [ "${{ github.event.schedule }}" = "15 2 * * *" ]; then
            pnpm tsx crawler/index.ts discover
            pnpm tsx crawler/index.ts refresh-hot
          else
            pnpm tsx crawler/index.ts refresh-store
          fi
